name: ci-terraform

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/ci-terraform.yml"]
  push:
    branches: [master]
    paths: ["infra/**", ".github/workflows/ci-terraform.yml"]

permissions:
  contents: read

concurrency:
  group: ci-terraform-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  TF_VERSION: "1.14.8"

jobs:
  validate:
    name: fmt · validate · scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - run: terraform fmt -check -recursive infra

      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --chdir=infra --recursive

      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          framework: terraform
          config_file: .checkov.yaml


  plan-global:
    name: plan (global)
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ github.event_name == 'pull_request' && vars.AWS_PLAN_ROLE_ARN != '' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - run: |
          terraform -chdir=infra/live/global init -input=false
          terraform -chdir=infra/live/global plan -input=false -no-color
